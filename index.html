      (() => {
        const operation = location.hash.startsWith("#operacao");
        document.getElementById("app-manifest").href = operation

          : "/manifest-clube.webmanifest";

          document.querySelector('link[rel="icon"]').href = "/pwa/operacao/icon-192.png";
          document.querySelector('link[rel="apple-touch-icon"]').href = "/pwa/operacao/apple-touch-icon.png";
          document.querySelector('meta[name="apple-mobile-web-app-title"]').content = "Adoce Operação";
        }
      })();
