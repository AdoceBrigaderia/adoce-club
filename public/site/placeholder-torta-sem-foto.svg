<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc">
  <title id="title">Foto da torta em breve</title>
  <desc id="desc">Esta torta ainda está sem fotografia oficial.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8f2"/>
      <stop offset="1" stop-color="#f2dfd4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3b170f" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1400" height="1050" fill="url(#bg)"/>
  <circle cx="1148" cy="189" r="200" fill="#ef635e" opacity=".10"/>
  <circle cx="182" cy="882" r="158" fill="#c58a42" opacity=".10"/>
  <g filter="url(#shadow)">
    <rect x="140" y="126" width="1120" height="798" rx="58" fill="#fffdfb" stroke="#ead2c5" stroke-width="4"/>
  </g>
  <g transform="translate(700 368)">
    <circle r="110" fill="#ef635e"/>
    <path d="M-47 21 C-26 -58 26 -58 47 21 Z" fill="#fff" opacity=".96"/>
    <circle cy="-48" r="19" fill="#fff"/>
  </g>
  <text x="50%" y="57%" text-anchor="middle" fill="#3b170f" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700">Foto da torta em breve</text>
  <text x="50%" y="66%" text-anchor="middle" fill="#8a6257" font-family="Arial, sans-serif" font-size="32" font-weight="700">Esta torta ainda está sem fotografia oficial.</text>
  <text x="50%" y="73%" text-anchor="middle" fill="#a17a6d" font-family="Arial, sans-serif" font-size="24">A composição descrita no catálogo permanece válida.</text>
  <text x="50%" y="82%" text-anchor="middle" fill="#ef635e" font-family="Arial, sans-serif" font-size="23" font-weight="800" letter-spacing="3">ADOCE BRIGADERIA</text>
</svg>
