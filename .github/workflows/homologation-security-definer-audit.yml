name: Auditar RPCs privilegiadas somente na homologação

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Digite AUDITAR RPCS SOMENTE HOMOLOGACAO seguido do project ref
        required: true
        type: string
      expected_commit:
        description: SHA completo autorizado da branch de reestruturação
        required: true
        type: string

concurrency:
  group: audit-security-definer-homologation
  cancel-in-progress: false

permissions:
  contents: read

env:
  EXPECTED_BRANCH: reestruturacao/ux-crm-operacao-imagens-v1
  HOMOLOGATION_REF: vazozolhbehnriytzcdc
  PRODUCTION_REF: uefwywizqhfvvijaopcn
  LIVE_AUDIT_FILE: supabase/tests/homologation_security_definer_live.sql

jobs:
  audit:
    name: Executar auditoria viva somente leitura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: homologation
    steps:
      - name: Baixar exclusivamente a branch autorizada
        uses: actions/checkout@v4
        with:
          ref: reestruturacao/ux-crm-operacao-imagens-v1
          fetch-depth: 1
          persist-credentials: false

      - name: Validar autorização, commit e isolamento
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$CONFIRMATION" = "AUDITAR RPCS SOMENTE HOMOLOGACAO $HOMOLOGATION_REF"
          test -s "$LIVE_AUDIT_FILE"
          test -n "$SUPABASE_HOMOLOGATION_DB_URL"
          case "$SUPABASE_HOMOLOGATION_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "URL PostgreSQL inválida" >&2; exit 1 ;;
          esac
          case "$SUPABASE_HOMOLOGATION_DB_URL" in
            *"$HOMOLOGATION_REF"*) ;;
            *) echo "URL não pertence à homologação" >&2; exit 1 ;;
          esac
          case "$SUPABASE_HOMOLOGATION_DB_URL" in
            *"$PRODUCTION_REF"*) echo "Referência produtiva rejeitada" >&2; exit 1 ;;
          esac
          ! grep -q "$PRODUCTION_REF" "$LIVE_AUDIT_FILE"

      - name: Instalar cliente PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Executar auditoria viva sem persistência
        env:
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
          PGCONNECT_TIMEOUT: "20"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/homologation-security-definer-audit
          psql "$SUPABASE_HOMOLOGATION_DB_URL" \
            --no-psqlrc --set=ON_ERROR_STOP=1 \
            --file="$LIVE_AUDIT_FILE" \
            > artifacts/homologation-security-definer-audit/live-audit.log
          printf '%s\n' "$(git rev-parse HEAD)" > artifacts/homologation-security-definer-audit/commit.txt
          printf '%s\n' "$HOMOLOGATION_REF" > artifacts/homologation-security-definer-audit/project-ref.txt
          ! grep -R "$PRODUCTION_REF" artifacts/homologation-security-definer-audit
          ! grep -R "postgresql://\|postgres://" artifacts/homologation-security-definer-audit

      - name: Preservar evidências redigidas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-rpcs-homologacao-${{ github.run_number }}
          path: artifacts/homologation-security-definer-audit
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
