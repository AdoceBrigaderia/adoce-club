name: Aplicação única do catálogo configurável na homologação

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/homologation-apply-products-one-shot.yml

concurrency:
  group: homologation-products-one-shot
  cancel-in-progress: false

permissions:
  contents: read

env:
  EXPECTED_BRANCH: reestruturacao/ux-crm-operacao-imagens-v1
  AUTHORIZED_PARENT: 0d06abd3499e61514c68587308ef1df2aa44ed29
  HOMOLOGATION_REF: vazozolhbehnriytzcdc
  PRODUCTION_REF: uefwywizqhfvvijaopcn
  PENDING_PLAN: docs/evidence/homologation-pending-migrations-20260728.json
  BACKUP_SHA256: e45f322ecece827609f2932762e390353f7b4a72ed709269e6d500f2f60ad354
  SUPABASE_TELEMETRY_DISABLED: "true"

jobs:
  apply:
    name: Dry-run, aplicação integral e auditoria
    if: ${{ github.head_ref == 'reestruturacao/ux-crm-operacao-imagens-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: homologation
    steps:
      - name: Baixar o head exato
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validar commit, alteração única e isolamento
        env:
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "$AUTHORIZED_PARENT"
          test "$(git diff --name-only "$AUTHORIZED_PARENT" HEAD)" = ".github/workflows/homologation-apply-products-one-shot.yml"
          test -n "$SUPABASE_HOMOLOGATION_DB_URL"
          case "$SUPABASE_HOMOLOGATION_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "URL PostgreSQL inválida" >&2; exit 1 ;;
          esac
          case "$SUPABASE_HOMOLOGATION_DB_URL" in
            *"$HOMOLOGATION_REF"*) ;;
            *) echo "URL não pertence à homologação" >&2; exit 1 ;;
          esac
          case "$SUPABASE_HOMOLOGATION_DB_URL" in
            *"$PRODUCTION_REF"*) echo "Referência produtiva rejeitada" >&2; exit 1 ;;
          esac
          test -f docs/evidence/homologation-backup-confirmed-20260728.json
          node - <<'NODE'
          const fs = require('fs');
          const evidence = JSON.parse(fs.readFileSync('docs/evidence/homologation-backup-confirmed-20260728.json', 'utf8'));
          const expected = process.env.BACKUP_SHA256;
          const serialized = JSON.stringify(evidence);
          if (!serialized.includes(expected)) throw new Error('SHA-256 do backup autorizado não encontrado na evidência.');
          if (!/confirmed|validado|validated/i.test(serialized)) throw new Error('Backup não está confirmado na evidência.');
          NODE

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validar código, testes e plano das migrations
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit
          npm run lint
          npx vitest run \
            netlify/functions/_shared/product-configuration-input.test.ts \
            src/product-configuration.test.ts \
            src/unified-configurable-products-migration.test.ts \
            src/configurable-product-constraints-migration.test.ts \
            src/configurable-product-consistency-migration.test.ts \
            src/configured-orders-workspace.test.ts \
            src/service-request-pricing-snapshot-ui.test.ts \
            src/bff-rpc-security.test.ts
          npm run test:homologation-pending-migrations
          npm run test:homologation-migration-apply
          npm run report:homologation-pending-migrations
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('artifacts/homologation-pending-migrations.json', 'utf8'));
          if (report.structural_passed !== true) throw new Error(`Plano estrutural reprovado: ${report.errors.join(', ')}`);
          if (report.pending_count !== 22) throw new Error(`Esperadas 22 migrations; encontradas ${report.pending_count}.`);
          if (report.apply_blockers.length !== 1 || report.apply_blockers[0] !== 'dry_run_pendente') {
            throw new Error(`Bloqueios inesperados: ${report.apply_blockers.join(', ')}`);
          }
          NODE

      - name: Instalar cliente PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Executar dry-run integral das 22 migrations
        env:
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/homologation-products-one-shot
          npx --yes supabase@2.109.1 db push \
            --db-url "$SUPABASE_HOMOLOGATION_DB_URL" \
            --include-all \
            --dry-run \
            > artifacts/homologation-products-one-shot/dry-run.log 2>&1
          node - <<'NODE'
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync(process.env.PENDING_PLAN, 'utf8'));
          const output = fs.readFileSync('artifacts/homologation-products-one-shot/dry-run.log', 'utf8');
          if (plan.pending_migrations.length !== 22) throw new Error('Plano não contém 22 migrations.');
          const missing = plan.pending_migrations.map((item) => item.version).filter((version) => !output.includes(version));
          if (missing.length) throw new Error(`Dry-run não listou: ${missing.join(', ')}`);
          fs.writeFileSync(
            'artifacts/homologation-products-one-shot/expected-versions.txt',
            `${plan.pending_migrations.map((item) => item.version).sort().join('\n')}\n`,
          );
          NODE

      - name: Aplicar exatamente o lote aprovado na homologação
        env:
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.109.1 db push \
            --db-url "$SUPABASE_HOMOLOGATION_DB_URL" \
            --include-all \
            --yes \
            > artifacts/homologation-products-one-shot/apply.log 2>&1

      - name: Confirmar histórico remoto e executar auditoria viva
        env:
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
          PGCONNECT_TIMEOUT: "20"
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_HOMOLOGATION_DB_URL" \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="select version from supabase_migrations.schema_migrations where version >= '20260728000000' order by version" \
            > artifacts/homologation-products-one-shot/applied-versions.txt
          diff -u \
            artifacts/homologation-products-one-shot/expected-versions.txt \
            artifacts/homologation-products-one-shot/applied-versions.txt
          psql "$SUPABASE_HOMOLOGATION_DB_URL" \
            --no-psqlrc --set=ON_ERROR_STOP=1 \
            --file=supabase/tests/homologation_post_migration_live.sql \
            > artifacts/homologation-products-one-shot/live-audit.log

      - name: Confirmar ausência de produção e preservar evidências
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${{ github.event.pull_request.head.sha }}" > artifacts/homologation-products-one-shot/commit.txt
          printf '%s\n' "$HOMOLOGATION_REF" > artifacts/homologation-products-one-shot/project-ref.txt
          printf '%s\n' "$BACKUP_SHA256" > artifacts/homologation-products-one-shot/backup-sha256.txt
          ! grep -R "$PRODUCTION_REF" artifacts/homologation-products-one-shot
          ! grep -R "postgresql://\|postgres://" artifacts/homologation-products-one-shot

      - name: Publicar evidências redigidas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-produtos-one-shot-${{ github.run_number }}
          path: artifacts/homologation-products-one-shot
          if-no-files-found: warn
          retention-days: 30
