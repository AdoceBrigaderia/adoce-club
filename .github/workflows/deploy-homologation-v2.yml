name: Publicar homologação isolada v2

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Digite PUBLICAR SOMENTE HOMOLOGACAO
        required: true
        type: string
      expected_commit:
        description: Commit exato da branch aprovado para o preview
        required: true
        type: string

concurrency:
  group: deploy-homologation
  cancel-in-progress: false

permissions:
  contents: read

env:
  EXPECTED_BRANCH: reestruturacao/ux-crm-operacao-imagens-v1
  NETLIFY_CONTEXT: branch-deploy
  EXPECTED_SITE_URL: ${{ vars.HOMOLOGATION_SITE_URL }}
  PRODUCTION_SITE_ID: ${{ vars.NETLIFY_PRODUCTION_SITE_ID }}

jobs:
  deploy:
    name: Build, preview isolado e smoke externo
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: homologation
    steps:
      - name: Baixar somente a branch de reestruturação
        uses: actions/checkout@v4
        with:
          ref: reestruturacao/ux-crm-operacao-imagens-v1
          fetch-depth: 1
          persist-credentials: false

      - name: Validar autorização, branch, commit e site separado
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          HOMOLOGATION_SITE_ID: ${{ secrets.NETLIFY_HOMOLOGATION_SITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "PUBLICAR SOMENTE HOMOLOGACAO"
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -n "$HOMOLOGATION_SITE_ID"
          test -n "$PRODUCTION_SITE_ID"
          test "$HOMOLOGATION_SITE_ID" != "$PRODUCTION_SITE_ID"
          case "$EXPECTED_SITE_URL" in
            https://*.netlify.app) ;;
            *) echo "URL de homologação inválida" >&2; exit 1 ;;
          esac
          case "$EXPECTED_SITE_URL" in
            *adocebrigaderia.com.br*) echo "Domínio de produção proibido" >&2; exit 1 ;;
          esac

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar e validar o portal
        run: |
          npm ci --prefer-offline --no-audit
          npm run verify

      - name: Vincular ao projeto exclusivo de homologação
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_HOMOLOGATION_SITE_ID: ${{ secrets.NETLIFY_HOMOLOGATION_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          npx --yes netlify-cli@26.2.0 link --id "$NETLIFY_HOMOLOGATION_SITE_ID"

      - name: Gerar diagnósticos redigidos, validar cofre e gerar build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_HOMOLOGATION_SITE_ID: ${{ secrets.NETLIFY_HOMOLOGATION_SITE_ID }}
          ADOCE_PREFLIGHT_COMMIT: ${{ inputs.expected_commit }}
        run: |
          mkdir -p artifacts
          npm run report:migration-integrity
          npx --yes netlify-cli@26.2.0 dev:exec --context "$NETLIFY_CONTEXT" npm run report:homologation-preflight
          npx --yes netlify-cli@26.2.0 dev:exec --context "$NETLIFY_CONTEXT" npm run gate:homologation-environment
          npx --yes netlify-cli@26.2.0 build --context "$NETLIFY_CONTEXT"

      - name: Criar deploy de rascunho com alias
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_HOMOLOGATION_SITE_ID: ${{ secrets.NETLIFY_HOMOLOGATION_SITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx --yes netlify-cli@26.2.0 deploy \
            --site "$NETLIFY_HOMOLOGATION_SITE_ID" \
            --context "$NETLIFY_CONTEXT" \
            --alias homologacao-adoce \
            --dir dist \
            --functions netlify/functions \
            --skip-functions-cache \
            --no-build \
            --json > artifacts/netlify-homologation-deploy.json
          node - <<'NODE'
          const fs = require('fs');
          const deploy = JSON.parse(fs.readFileSync('artifacts/netlify-homologation-deploy.json', 'utf8'));
          if (!deploy.deploy_id && !deploy.id) throw new Error('Deploy sem identificador.');
          if (deploy.is_prod === true) throw new Error('Deploy produtivo foi rejeitado.');

          const deployUrl = deploy.deploy_url || deploy.ssl_url || deploy.url;
          if (!deployUrl) throw new Error('Deploy sem URL HTTPS.');
          const deployed = new URL(deployUrl);
          const expected = new URL(process.env.EXPECTED_SITE_URL);
          const expectedHost = expected.hostname.toLowerCase();
          const deployedHost = deployed.hostname.toLowerCase();
          const belongsToHomologationSite =
            deployedHost === expectedHost || deployedHost.endsWith(`--${expectedHost}`);
          if (deployed.protocol !== 'https:' || !deployedHost.endsWith('.netlify.app')) {
            throw new Error('URL do deploy não pertence à Netlify HTTPS.');
          }
          if (!belongsToHomologationSite) {
            throw new Error('URL do deploy não pertence ao site reservado de homologação.');
          }
          if (deployedHost.includes('adocebrigaderia.com.br')) {
            throw new Error('Domínio produtivo rejeitado no deploy.');
          }

          fs.writeFileSync('artifacts/homologation-deploy-url.txt', `${deployed.origin}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `HOMOLOGATION_DEPLOY_URL=${deployed.origin}\n`);
          NODE

      - name: Validar readiness do deploy exato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOMOLOGATION_DEPLOY_URL"
          status="000"
          for attempt in $(seq 1 18); do
            status="$(curl -sS -o artifacts/homologation-readiness.json -w '%{http_code}' "$HOMOLOGATION_DEPLOY_URL/api/homologation-readiness" || true)"
            [ "$status" = "200" ] && break
            sleep 5
          done
          test "$status" = "200"
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('artifacts/homologation-readiness.json', 'utf8'));
          if (payload.environment !== 'homologation') throw new Error('Ambiente incorreto.');
          if (payload.coreReady !== true) throw new Error('Núcleo da homologação não está pronto.');
          if (payload.security?.configured !== true) throw new Error('Segredos de proteção do núcleo estão incompletos.');
          if (payload.site?.productionDomainRejected !== true) throw new Error('Domínio de produção não foi rejeitado.');
          if (payload.supabase?.isolated !== true) throw new Error('Supabase não está isolado.');
          NODE

      - name: Executar Playwright no deploy exato
        run: |
          test -n "$HOMOLOGATION_DEPLOY_URL"
          npm install --no-save --no-package-lock @playwright/test@1.61.1
          npx playwright install --with-deps chromium
          PLAYWRIGHT_BASE_URL="$HOMOLOGATION_DEPLOY_URL" npx playwright test

      - name: Preservar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-publicada-${{ github.run_number }}
          path: |
            artifacts/migration-integrity.json
            artifacts/migration-integrity.md
            artifacts/homologation-preflight.json
            artifacts/homologation-preflight.md
            artifacts/netlify-homologation-deploy.json
            artifacts/homologation-deploy-url.txt
            artifacts/homologation-readiness.json
            artifacts/playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
