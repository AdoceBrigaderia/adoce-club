name: Empacotar migrations pendentes da homologação

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/homologation-package-pending-migrations-one-shot.yml
      - docs/evidence/homologation-pending-migrations-20260728.json
      - supabase/migrations/**
      - ops/netlify-homologation-proxy.json

concurrency:
  group: homologation-pending-migrations-package-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  EXPECTED_BRANCH: reestruturacao/ux-crm-operacao-imagens-v1
  PENDING_PLAN: docs/evidence/homologation-pending-migrations-20260728.json
  HOMOLOGATION_REF: vazozolhbehnriytzcdc
  PRODUCTION_REF: uefwywizqhfvvijaopcn
  HOMOLOGATION_SITE_ID: f0cc51be-a0ec-4451-9644-a394592cdc37
  PRODUCTION_SITE_ID: bb0c96cd-5af2-4270-a9a8-b63b9637b1f4

jobs:
  package:
    name: Validar, empacotar e transportar homologação
    if: ${{ github.head_ref == 'reestruturacao/ux-crm-operacao-imagens-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar o head exato
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validar branch, commit e isolamento
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$HOMOLOGATION_REF" = "vazozolhbehnriytzcdc"
          test "$PRODUCTION_REF" = "uefwywizqhfvvijaopcn"
          test "$HOMOLOGATION_REF" != "$PRODUCTION_REF"
          test "$HOMOLOGATION_SITE_ID" != "$PRODUCTION_SITE_ID"

      - name: Validar plano e empacotar exatamente as 22 migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/homologation-pending-migrations/migrations
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const plan = JSON.parse(fs.readFileSync(process.env.PENDING_PLAN, 'utf8'));
          if (plan.project_id !== process.env.HOMOLOGATION_REF) throw new Error('Projeto de homologação inválido.');
          if (plan.production_project_id !== process.env.PRODUCTION_REF) throw new Error('Referência produtiva esperada não está declarada.');
          if (plan.production_forbidden !== true) throw new Error('Bloqueio produtivo ausente.');
          if (plan.pending_migrations.length !== 22) throw new Error(`Esperadas 22 migrations; recebidas ${plan.pending_migrations.length}.`);
          const manifest = [];
          for (const migration of plan.pending_migrations) {
            const file = `${migration.version}_${migration.name}.sql`;
            const source = path.join('supabase', 'migrations', file);
            if (!fs.existsSync(source)) throw new Error(`Migration ausente: ${file}`);
            const content = fs.readFileSync(source);
            if (content.includes(Buffer.from(process.env.PRODUCTION_REF))) throw new Error(`Referência produtiva encontrada em ${file}`);
            fs.copyFileSync(source, path.join('artifacts', 'homologation-pending-migrations', 'migrations', file));
            manifest.push({
              version: migration.version,
              name: migration.name,
              file,
              bytes: content.length,
              sha256: crypto.createHash('sha256').update(content).digest('hex'),
            });
          }
          fs.writeFileSync(
            'artifacts/homologation-pending-migrations/manifest.json',
            JSON.stringify({
              schema_version: 1,
              repository: 'AdoceBrigaderia/adoce-club',
              branch: process.env.EXPECTED_BRANCH,
              commit: process.env.GITHUB_SHA,
              project_id: process.env.HOMOLOGATION_REF,
              production_forbidden: true,
              migrations: manifest,
            }, null, 2),
          );
          NODE
          cp "$PENDING_PLAN" artifacts/homologation-pending-migrations/plan.json
          test "$(find artifacts/homologation-pending-migrations/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 22

      - name: Empacotar source exato do commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/homologation-source
          git archive --format=tar.gz --output=artifacts/homologation-source/adoce-source.tar.gz HEAD
          printf '%s\n' "$(git rev-parse HEAD)" > artifacts/homologation-source/commit.txt
          sha256sum artifacts/homologation-source/adoce-source.tar.gz > artifacts/homologation-source/sha256.txt
          test -s artifacts/homologation-source/adoce-source.tar.gz

      - name: Preparar runtime portátil do Netlify MCP
        shell: bash
        run: |
          set -euo pipefail
          runtime="$GITHUB_WORKSPACE/artifacts/netlify-mcp-runtime"
          mkdir -p "$runtime"
          cd "$runtime"
          npm init -y >/dev/null
          npm install --omit=dev --no-audit --no-fund @netlify/mcp@1.15.1
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('node_modules/@netlify/mcp/package.json', 'utf8'));
          fs.writeFileSync('runtime.json', JSON.stringify({ name: pkg.name, version: pkg.version, bin: pkg.bin }, null, 2));
          NODE
          test -s runtime.json

      - name: Gerar chave temporária para o proxy
        if: ${{ hashFiles('ops/netlify-homologation-proxy.json') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          key_dir="artifacts/netlify-proxy-key"
          mkdir -p "$key_dir/private" "$key_dir/public"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$key_dir/private/private.pem" >/dev/null 2>&1
          openssl pkey -in "$key_dir/private/private.pem" -pubout -out "$key_dir/public/public.pem"
          printf '%s\n' "$GITHUB_RUN_ID" > "$key_dir/private/run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$key_dir/public/run-id.txt"
          chmod 600 "$key_dir/private/private.pem"

      - name: Descriptografar proxy e publicar somente homologação
        if: ${{ hashFiles('ops/netlify-homologation-proxy.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          envelope=ops/netlify-homologation-proxy.json
          key_run_id="$(node -p "require('./$envelope').key_run_id")"
          expected_parent="$(node -p "require('./$envelope').expected_parent")"
          requested_site="$(node -p "require('./$envelope').site_id")"
          test "$requested_site" = "$HOMOLOGATION_SITE_ID"
          test "$requested_site" != "$PRODUCTION_SITE_ID"
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git diff --name-only "$expected_parent" HEAD)" = "$envelope"

          private_dir="$RUNNER_TEMP/netlify-private-key"
          mkdir -p "$private_dir"
          gh run download "$key_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "netlify-proxy-private-$key_run_id" \
            --dir "$private_dir"
          test -s "$private_dir/private.pem"

          node - <<'NODE'
          const fs = require('fs');
          const env = JSON.parse(fs.readFileSync('ops/netlify-homologation-proxy.json', 'utf8'));
          fs.writeFileSync(process.env.RUNNER_TEMP + '/netlify-key.enc', Buffer.from(env.encrypted_key_b64, 'base64'));
          fs.writeFileSync(process.env.RUNNER_TEMP + '/netlify-proxy.enc', Buffer.from(env.ciphertext_b64, 'base64'));
          NODE
          openssl pkeyutl -decrypt \
            -inkey "$private_dir/private.pem" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in "$RUNNER_TEMP/netlify-key.enc" \
            -out "$RUNNER_TEMP/netlify-aes.key"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass file:"$RUNNER_TEMP/netlify-aes.key" \
            -in "$RUNNER_TEMP/netlify-proxy.enc" \
            -out "$RUNNER_TEMP/netlify-proxy.txt"
          proxy_path="$(cat "$RUNNER_TEMP/netlify-proxy.txt")"
          case "$proxy_path" in
            https://netlify-mcp.netlify.app//proxy/*) ;;
            *) echo "Proxy Netlify inválido" >&2; exit 1 ;;
          esac

          mkdir -p artifacts/netlify-proxy-deploy
          node artifacts/netlify-mcp-runtime/node_modules/@netlify/mcp/dist/netlify-mcp.js \
            --site-id "$HOMOLOGATION_SITE_ID" \
            --proxy-path "$proxy_path" \
            2>&1 | tee artifacts/netlify-proxy-deploy/deploy.log
          grep -q 'Deploy is ready!' artifacts/netlify-proxy-deploy/deploy.log
          ! grep -q "$PRODUCTION_SITE_ID" artifacts/netlify-proxy-deploy/deploy.log
          rm -f "$RUNNER_TEMP/netlify-key.enc" "$RUNNER_TEMP/netlify-proxy.enc" "$RUNNER_TEMP/netlify-aes.key" "$RUNNER_TEMP/netlify-proxy.txt"

      - name: Publicar pacote validado
        uses: actions/upload-artifact@v4
        with:
          name: migrations-pendentes-homologacao-${{ github.run_number }}
          path: artifacts/homologation-pending-migrations
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Publicar source do commit
        uses: actions/upload-artifact@v4
        with:
          name: source-homologacao-${{ github.run_number }}
          path: artifacts/homologation-source
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Publicar runtime do Netlify MCP
        uses: actions/upload-artifact@v4
        with:
          name: netlify-mcp-runtime-${{ github.run_number }}
          path: artifacts/netlify-mcp-runtime
          if-no-files-found: error
          retention-days: 2
          compression-level: 6

      - name: Preservar chave pública temporária
        if: ${{ hashFiles('ops/netlify-homologation-proxy.json') == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: netlify-proxy-public-${{ github.run_id }}
          path: artifacts/netlify-proxy-key/public
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Preservar chave privada temporária
        if: ${{ hashFiles('ops/netlify-homologation-proxy.json') == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: netlify-proxy-private-${{ github.run_id }}
          path: artifacts/netlify-proxy-key/private
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Preservar evidência do deploy temporário
        if: ${{ hashFiles('ops/netlify-homologation-proxy.json') != '' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: netlify-proxy-deploy-${{ github.run_number }}
          path: artifacts/netlify-proxy-deploy
          if-no-files-found: warn
          retention-days: 2
          compression-level: 6
