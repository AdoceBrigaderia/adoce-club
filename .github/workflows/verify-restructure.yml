name: Verificar reestruturação

on:
  push:
    branches:
      - reestruturacao/ux-crm-operacao-imagens-v1
  pull_request:
    branches:
      - fonte-oficial/portal-adoce-2026-07-25
  workflow_dispatch:

concurrency:
  group: verify-restructure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --prefer-offline --no-audit

      - name: Preparar diagnósticos
        run: mkdir -p artifacts

      - id: lint
        name: Validar TypeScript
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee artifacts/typescript.log

      - id: tests
        name: Executar testes Vitest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee artifacts/vitest.log

      - id: audit_tests
        name: Testar auditoria da biblioteca
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:image-library-audit 2>&1 | tee artifacts/image-audit-tests.log

      - id: browser_audit_tests
        name: Testar auditoria da fronteira BFF
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser-security-audit 2>&1 | tee artifacts/browser-security-audit-tests.log

      - id: homologation_gate_tests
        name: Testar isolamento da homologação
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:homologation-environment 2>&1 | tee artifacts/homologation-environment-tests.log

      - id: audit
        name: Auditar referências de imagens
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run audit:image-library 2>&1 | tee artifacts/image-audit.log

      - id: browser_audit
        name: Auditar tokens e autenticação no navegador
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run audit:browser-security 2>&1 | tee artifacts/browser-security-audit.log

      - id: build
        name: Gerar build de homologação
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee artifacts/build.log

      - name: Preservar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosticos-reestruturacao-${{ github.run_number }}
          path: artifacts
          if-no-files-found: error
          retention-days: 7

      - name: Preservar build para inspeção
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: portal-adoce-reestruturacao
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Consolidar resultado
        if: always()
        env:
          LINT_RESULT: ${{ steps.lint.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          AUDIT_TEST_RESULT: ${{ steps.audit_tests.outcome }}
          BROWSER_AUDIT_TEST_RESULT: ${{ steps.browser_audit_tests.outcome }}
          HOMOLOGATION_GATE_TEST_RESULT: ${{ steps.homologation_gate_tests.outcome }}
          AUDIT_RESULT: ${{ steps.audit.outcome }}
          BROWSER_AUDIT_RESULT: ${{ steps.browser_audit.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          echo "TypeScript: $LINT_RESULT"
          echo "Vitest: $TEST_RESULT"
          echo "Testes da auditoria de imagens: $AUDIT_TEST_RESULT"
          echo "Testes da auditoria do navegador: $BROWSER_AUDIT_TEST_RESULT"
          echo "Testes do isolamento de homologação: $HOMOLOGATION_GATE_TEST_RESULT"
          echo "Auditoria de imagens: $AUDIT_RESULT"
          echo "Auditoria do navegador: $BROWSER_AUDIT_RESULT"
          echo "Build: $BUILD_RESULT"
          test "$LINT_RESULT" = success
          test "$TEST_RESULT" = success
          test "$AUDIT_TEST_RESULT" = success
          test "$BROWSER_AUDIT_TEST_RESULT" = success
          test "$HOMOLOGATION_GATE_TEST_RESULT" = success
          test "$AUDIT_RESULT" = success
          test "$BROWSER_AUDIT_RESULT" = success
          test "$BUILD_RESULT" = success
