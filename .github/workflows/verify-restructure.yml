name: Verificar reestruturação

on:
  push:
    branches:
      - reestruturacao/ux-crm-operacao-imagens-v1
  pull_request:
    branches:
      - fonte-oficial/portal-adoce-2026-07-25
  workflow_dispatch:

concurrency:
  group: verify-restructure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --prefer-offline --no-audit

      - name: Validar TypeScript
        run: npm run lint

      - name: Executar testes Vitest
        run: npm run test

      - name: Testar auditoria da biblioteca
        run: npm run test:image-library-audit

      - name: Auditar referências de imagens
        run: npm run audit:image-library

      - name: Gerar build de homologação
        run: npm run build

      - name: Preservar build para inspeção
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: portal-adoce-reestruturacao
          path: dist
          if-no-files-found: error
          retention-days: 7
