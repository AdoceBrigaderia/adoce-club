name: Aplicar migrations somente na homologação

on:
  push:
    branches:
      - reestruturacao/ux-crm-operacao-imagens-v1
    paths:
      - .github/workflows/apply-homologation-migrations-now.yml
      - scripts/reconcile-homologation-migration-filenames.mjs
      - scripts/reconcile-homologation-migration-filenames.test.mjs
      - docs/evidence/homologation-backup-confirmed-20260728.json
      - docs/evidence/homologation-migrations-20260727.json
      - docs/evidence/homologation-migration-repair-plan-20260727.json
      - docs/evidence/homologation-pending-migrations-20260728.json
      - supabase/migrations/**

concurrency:
  group: apply-homologation-migrations-now
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Dry-run, aplicação e validação da homologação
    if: ${{ github.event.head_commit.message == 'ci: aplicar migrations somente na homologação' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: homologation
    env:
      HOMOLOGATION_REF: vazozolhbehnriytzcdc
      PRODUCTION_REF: uefwywizqhfvvijaopcn
      EXPECTED_BRANCH: reestruturacao/ux-crm-operacao-imagens-v1
      BACKUP_EVIDENCE: docs/evidence/homologation-backup-confirmed-20260728.json
      PGCONNECT_TIMEOUT: '20'
    steps:
      - name: Baixar o SHA exato autorizado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validar autorização e isolamento absoluto
        env:
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "AdoceBrigaderia/adoce-club"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${{ github.event.head_commit.message }}" = "ci: aplicar migrations somente na homologação"
          test "$HOMOLOGATION_REF" = "vazozolhbehnriytzcdc"
          test "$PRODUCTION_REF" = "uefwywizqhfvvijaopcn"
          test "$HOMOLOGATION_REF" != "$PRODUCTION_REF"
          test -n "$SUPABASE_HOMOLOGATION_DB_URL"
          case "$SUPABASE_HOMOLOGATION_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "URL PostgreSQL inválida" >&2; exit 1 ;;
          esac
          case "$SUPABASE_HOMOLOGATION_DB_URL" in
            *"$HOMOLOGATION_REF"*) ;;
            *) echo "URL não pertence à homologação" >&2; exit 1 ;;
          esac
          case "$SUPABASE_HOMOLOGATION_DB_URL" in
            *"$PRODUCTION_REF"*) echo "Produção detectada e rejeitada" >&2; exit 1 ;;
          esac
          echo "::add-mask::$SUPABASE_HOMOLOGATION_DB_URL"

      - name: Validar evidência do backup recuperável
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const evidence = JSON.parse(fs.readFileSync(process.env.BACKUP_EVIDENCE, 'utf8'));
          if (evidence.project_id !== 'vazozolhbehnriytzcdc') throw new Error('Backup não pertence à homologação.');
          if (evidence.production_forbidden !== true) throw new Error('Proteção de produção ausente.');
          if (evidence.accepted_for_homologation_migration_gate !== true) throw new Error('Backup não aceito pelo gate.');
          if (evidence.package?.sha256 !== 'e45f322ecece827609f2932762e390353f7b4a72ed709269e6d500f2f60ad354') throw new Error('Digest do backup divergente.');
          if (evidence.package?.invalid_checksum_count !== 0) throw new Error('Backup possui checksum inválido.');
          if (evidence.storage?.verified_object_count !== 430) throw new Error('Storage incompleto.');
          NODE

      - name: Configurar Node.js e PostgreSQL
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Testar e alinhar nomes locais das migrations
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/reconcile-homologation-migration-filenames.test.mjs
          node scripts/reconcile-homologation-migration-filenames.mjs --strict --apply
          git diff --check

      - name: Confirmar repairs já efetivados no histórico remoto
        env:
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/homologation-migrations
          psql "$SUPABASE_HOMOLOGATION_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="select version || ':' || name from supabase_migrations.schema_migrations where name in ('backend_only_tables_explicit_deny','operational_foreign_key_indexes','public_analytics_bff_only') order by version" \
            > artifacts/homologation-migrations/repair-scope-before.txt
          cat > artifacts/homologation-migrations/repair-scope-expected.txt <<'EXPECTED'
          20260727035116:backend_only_tables_explicit_deny
          20260727035246:operational_foreign_key_indexes
          20260727035513:public_analytics_bff_only
          EXPECTED
          diff -u artifacts/homologation-migrations/repair-scope-expected.txt artifacts/homologation-migrations/repair-scope-before.txt
          psql "$SUPABASE_HOMOLOGATION_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --csv \
            --command="select version, name from supabase_migrations.schema_migrations order by version" \
            > artifacts/homologation-migrations/history-before.csv

      - name: Executar dry-run integral
        env:
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.109.1 db push \
            --db-url "$SUPABASE_HOMOLOGATION_DB_URL" \
            --dry-run \
            > artifacts/homologation-migrations/db-push-dry-run.txt 2>&1
          cat artifacts/homologation-migrations/db-push-dry-run.txt
          for migration in \
            20260728073000 20260728090000 20260728093000 20260728103000 \
            20260728115000 20260728115100 20260728130000 20260728154500 \
            20260728164000 20260728165116 20260728165303 20260728170236 \
            20260728170246 20260728170307 20260728170501 20260728170941 \
            20260728174500; do
            grep -q "$migration" artifacts/homologation-migrations/db-push-dry-run.txt
          done

      - name: Aplicar as 17 migrations na homologação
        env:
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.109.1 db push \
            --db-url "$SUPABASE_HOMOLOGATION_DB_URL" \
            > artifacts/homologation-migrations/db-push-apply.txt 2>&1
          cat artifacts/homologation-migrations/db-push-apply.txt

      - name: Validar histórico, tabelas, funções e RLS
        env:
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_HOMOLOGATION_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --csv \
            --command="select version, name from supabase_migrations.schema_migrations order by version" \
            > artifacts/homologation-migrations/history-after.csv
          test "$(psql "$SUPABASE_HOMOLOGATION_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select count(*) from supabase_migrations.schema_migrations where version >= '20260728073000'")" = "17"
          test "$(psql "$SUPABASE_HOMOLOGATION_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="select max(version) from supabase_migrations.schema_migrations")" = "20260728174500"
          psql "$SUPABASE_HOMOLOGATION_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align <<'SQL' > artifacts/homologation-migrations/schema-smoke.txt
          select case when every(object_name is not null) then 'ok' else 'missing' end
          from (
            values
              (to_regclass('public.cake_builder_templates')::text),
              (to_regclass('public.costing_items')::text),
              (to_regclass('public.costing_recipes')::text),
              (to_regclass('public.costing_cost_snapshots')::text),
              (to_regclass('public.service_request_pricing_snapshots')::text),
              (to_regclass('public.gallery_media_versions')::text)
          ) as required(object_name);
          select count(*)
          from pg_class c
          join pg_namespace n on n.oid = c.relnamespace
          where n.nspname = 'public'
            and c.relname in ('cake_builder_templates','costing_items','costing_recipes','costing_cost_snapshots','service_request_pricing_snapshots','gallery_media_versions')
            and c.relrowsecurity;
          SQL
          grep -qx 'ok' artifacts/homologation-migrations/schema-smoke.txt
          grep -qx '6' artifacts/homologation-migrations/schema-smoke.txt

      - name: Gerar evidência local da aplicação
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const history = fs.readFileSync('artifacts/homologation-migrations/history-after.csv', 'utf8');
          const report = {
            schema_version: 1,
            environment: 'homologation',
            project_id: 'vazozolhbehnriytzcdc',
            production_forbidden: true,
            source_commit: process.env.GITHUB_SHA,
            completed_at: new Date().toISOString(),
            backup_sha256: 'e45f322ecece827609f2932762e390353f7b4a72ed709269e6d500f2f60ad354',
            repairs_confirmed: true,
            dry_run_completed: true,
            migrations_applied: 17,
            final_version: '20260728174500',
            history_line_count: history.trim().split(/\r?\n/).length,
          };
          fs.writeFileSync('artifacts/homologation-migrations/homologation-migrations-applied-20260728.json', `${JSON.stringify(report, null, 2)}\n`);
          NODE

      - name: Preservar todas as evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrations-homologacao-${{ github.run_number }}
          path: artifacts/homologation-migrations
          if-no-files-found: warn
          retention-days: 30
