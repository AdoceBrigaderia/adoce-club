name: Reparar histórico de migrations na homologação

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Digite REPARAR SOMENTE HOMOLOGACAO seguido do project ref
        required: true
        type: string
      expected_commit:
        description: SHA completo da branch autorizado para o repair
        required: true
        type: string
      backup_evidence:
        description: Digite BACKUP CONFIRMADO seguido da data, hora e identificador do backup recuperável
        required: true
        type: string

concurrency:
  group: migration-repair-homologation
  cancel-in-progress: false

permissions:
  contents: read

env:
  EXPECTED_BRANCH: reestruturacao/ux-crm-operacao-imagens-v1
  HOMOLOGATION_REF: ${{ vars.ADOCE_HOMOLOGATION_SUPABASE_REF }}
  PRODUCTION_REF: ${{ vars.ADOCE_PRODUCTION_SUPABASE_REF }}
  REPAIR_PLAN: docs/evidence/homologation-migration-repair-plan-20260727.json
  PENDING_PLAN: docs/evidence/homologation-pending-migrations-20260728.json

jobs:
  repair-history:
    name: Repair controlado sem executar SQL de negócio
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: homologation
    steps:
      - name: Baixar exclusivamente a branch de reestruturação
        uses: actions/checkout@v4
        with:
          ref: reestruturacao/ux-crm-operacao-imagens-v1
          fetch-depth: 1
          persist-credentials: false

      - name: Validar autorização, branch, commit, backup e projeto isolado
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          BACKUP_EVIDENCE: ${{ inputs.backup_evidence }}
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -n "$HOMOLOGATION_REF"
          test -n "$PRODUCTION_REF"
          test "$HOMOLOGATION_REF" = "vazozolhbehnriytzcdc"
          test "$PRODUCTION_REF" != "$HOMOLOGATION_REF"
          test "$CONFIRMATION" = "REPARAR SOMENTE HOMOLOGACAO $HOMOLOGATION_REF"
          case "$BACKUP_EVIDENCE" in
            "BACKUP CONFIRMADO "*) ;;
            *) echo "Evidência de backup recuperável ausente ou inválida" >&2; exit 1 ;;
          esac
          test "${#BACKUP_EVIDENCE}" -ge 35
          test -n "$SUPABASE_HOMOLOGATION_DB_URL"
          case "$SUPABASE_HOMOLOGATION_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "URL PostgreSQL de homologação inválida" >&2; exit 1 ;;
          esac
          case "$SUPABASE_HOMOLOGATION_DB_URL" in
            *"$HOMOLOGATION_REF"*) ;;
            *) echo "A URL não pertence à homologação" >&2; exit 1 ;;
          esac
          case "$SUPABASE_HOMOLOGATION_DB_URL" in
            *"$PRODUCTION_REF"*) echo "Referência de produção detectada" >&2; exit 1 ;;
          esac

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar inventário completo antes do repair
        env:
          BACKUP_EVIDENCE: ${{ inputs.backup_evidence }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/migration-repair
          node --test scripts/homologation-pending-migrations.test.mjs
          node scripts/homologation-pending-migrations.mjs --strict
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('artifacts/homologation-pending-migrations.json', 'utf8'));
          if (report.structural_passed !== true) throw new Error('Inventário pendente estruturalmente inválido.');
          if (report.pending_count !== 18) throw new Error(`Esperadas 18 migrations pendentes; encontradas ${report.pending_count}.`);
          if (!report.apply_blockers.includes('repairs_pendentes')) throw new Error('Repair não aparece como bloqueio obrigatório.');
          NODE
          printf '%s\n' "$BACKUP_EVIDENCE" > artifacts/migration-repair/backup-evidence.txt
          cp artifacts/homologation-pending-migrations.json artifacts/migration-repair/
          cp artifacts/homologation-pending-migrations.md artifacts/migration-repair/

      - name: Validar plano em dry-run
        run: |
          node scripts/homologation-migration-repair.mjs \
            --plan "$REPAIR_PLAN" \
            --output-dir artifacts/migration-repair

      - name: Instalar cliente PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Vincular o CLI exclusivamente à homologação
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@2.109.1 link \
            --project-ref "$HOMOLOGATION_REF" \
            --password "$SUPABASE_DB_PASSWORD"
          test "$(cat supabase/.temp/project-ref)" = "$HOMOLOGATION_REF"

      - name: Exportar backup redigido e validar duplicidades esperadas
        env:
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
          PGCONNECT_TIMEOUT: "15"
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_HOMOLOGATION_DB_URL" \
            --no-psqlrc --set=ON_ERROR_STOP=1 --csv \
            --command="select version, name from supabase_migrations.schema_migrations order by version" \
            > artifacts/migration-repair/history-before.csv
          psql "$SUPABASE_HOMOLOGATION_DB_URL" \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="select version || ':' || name from supabase_migrations.schema_migrations where version in ('20260727035059','20260727035116','20260727035246','20260727035343','20260727035513','20260727040533') order by version" \
            > artifacts/migration-repair/repair-scope-before.txt
          cat > artifacts/migration-repair/repair-scope-expected-before.txt <<'EXPECTED'
          20260727035059:backend_only_tables_explicit_deny
          20260727035116:backend_only_tables_explicit_deny
          20260727035246:operational_foreign_key_indexes
          20260727035343:operational_foreign_key_indexes
          20260727035513:public_analytics_bff_only
          20260727040533:public_analytics_bff_only
          EXPECTED
          diff -u \
            artifacts/migration-repair/repair-scope-expected-before.txt \
            artifacts/migration-repair/repair-scope-before.txt

      - name: Executar somente os três repairs aprovados
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          ADOCE_HOMOLOGATION_SUPABASE_REF: ${{ vars.ADOCE_HOMOLOGATION_SUPABASE_REF }}
          ADOCE_PRODUCTION_SUPABASE_REF: ${{ vars.ADOCE_PRODUCTION_SUPABASE_REF }}
          CONFIRM_HOMOLOGATION_MIGRATION_REPAIR: ${{ inputs.confirmation }}
        run: |
          node scripts/homologation-migration-repair.mjs \
            --apply \
            --plan "$REPAIR_PLAN" \
            --output-dir artifacts/migration-repair

      - name: Exportar histórico posterior e confirmar escopo final
        env:
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
          PGCONNECT_TIMEOUT: "15"
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_HOMOLOGATION_DB_URL" \
            --no-psqlrc --set=ON_ERROR_STOP=1 --csv \
            --command="select version, name from supabase_migrations.schema_migrations order by version" \
            > artifacts/migration-repair/history-after.csv
          psql "$SUPABASE_HOMOLOGATION_DB_URL" \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="select version || ':' || name from supabase_migrations.schema_migrations where name in ('backend_only_tables_explicit_deny','operational_foreign_key_indexes','public_analytics_bff_only') order by version" \
            > artifacts/migration-repair/repair-scope-after.txt
          cat > artifacts/migration-repair/repair-scope-expected-after.txt <<'EXPECTED'
          20260727035116:backend_only_tables_explicit_deny
          20260727035246:operational_foreign_key_indexes
          20260727035513:public_analytics_bff_only
          EXPECTED
          diff -u \
            artifacts/migration-repair/repair-scope-expected-after.txt \
            artifacts/migration-repair/repair-scope-after.txt
          npx --yes supabase@2.109.1 migration list --linked \
            > artifacts/migration-repair/migration-list-after.txt

      - name: Preservar evidências sem credenciais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-repair-homologation-${{ github.run_number }}
          path: artifacts/migration-repair
          retention-days: 30
          if-no-files-found: warn
