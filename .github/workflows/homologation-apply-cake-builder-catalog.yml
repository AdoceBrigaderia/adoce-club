name: Aplicar catálogo real do montador somente na homologação

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Digite APLICAR CATALOGO REAL DO MONTADOR SOMENTE HOMOLOGACAO seguido do project ref
        required: true
        type: string
      expected_commit:
        description: SHA completo autorizado da branch de reestruturação
        required: true
        type: string
      backup_evidence:
        description: Evidência do backup recuperável no formato BACKUP CONFIRMADO ...
        required: true
        type: string

concurrency:
  group: apply-cake-builder-catalog-homologation
  cancel-in-progress: false

permissions:
  contents: read

env:
  EXPECTED_BRANCH: reestruturacao/ux-crm-operacao-imagens-v1
  HOMOLOGATION_REF: vazozolhbehnriytzcdc
  PRODUCTION_REF: uefwywizqhfvvijaopcn
  SEED_FILE: supabase/seeds/homologation/20260729_real_cake_builder_catalog.sql
  LIVE_AUDIT_FILE: supabase/tests/homologation_cake_builder_catalog_live.sql

jobs:
  apply:
    name: Ensaio reversível, aplicação e auditoria viva
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: homologation
    steps:
      - name: Baixar exclusivamente a branch autorizada
        uses: actions/checkout@v4
        with:
          ref: reestruturacao/ux-crm-operacao-imagens-v1
          fetch-depth: 1
          persist-credentials: false

      - name: Validar autorização, commit, backup e isolamento
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          BACKUP_EVIDENCE: ${{ inputs.backup_evidence }}
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$CONFIRMATION" = "APLICAR CATALOGO REAL DO MONTADOR SOMENTE HOMOLOGACAO $HOMOLOGATION_REF"
          case "$BACKUP_EVIDENCE" in
            "BACKUP CONFIRMADO "*) ;;
            *) echo "Evidência de backup inválida" >&2; exit 1 ;;
          esac
          test "${#BACKUP_EVIDENCE}" -ge 35
          test -n "$SUPABASE_HOMOLOGATION_DB_URL"
          case "$SUPABASE_HOMOLOGATION_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "URL PostgreSQL inválida" >&2; exit 1 ;;
          esac
          case "$SUPABASE_HOMOLOGATION_DB_URL" in
            *"$HOMOLOGATION_REF"*) ;;
            *) echo "URL não pertence à homologação" >&2; exit 1 ;;
          esac
          case "$SUPABASE_HOMOLOGATION_DB_URL" in
            *"$PRODUCTION_REF"*) echo "Referência produtiva rejeitada" >&2; exit 1 ;;
          esac
          test -s "$SEED_FILE"
          test -s "$LIVE_AUDIT_FILE"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências e executar contratos estáticos
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit
          npx vitest run \
            src/cake-builder-real-catalog-seed.test.ts \
            src/cake-builder-homologation-seed-workflow.test.ts

      - name: Validar conteúdo e gerar ensaio reversível
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cake-builder-catalog
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const seedPath = process.env.SEED_FILE;
          const auditPath = process.env.LIVE_AUDIT_FILE;
          const productionRef = process.env.PRODUCTION_REF;
          const seed = fs.readFileSync(seedPath, 'utf8');
          const audit = fs.readFileSync(auditPath, 'utf8');

          if (!/^\s*begin;/i.test(seed)) throw new Error('Seed sem BEGIN inicial.');
          if (!/commit;\s*$/i.test(seed)) throw new Error('Seed sem COMMIT final.');
          if (/\b(drop|truncate)\b/i.test(seed)) throw new Error('Comando destrutivo proibido no seed.');
          if (/insert\s+into\s+public\.commercial_products/i.test(seed)) {
            throw new Error('Seed não pode inventar produtos comerciais.');
          }
          if (seed.includes(productionRef) || audit.includes(productionRef)) {
            throw new Error('Referência produtiva encontrada.');
          }

          const dryRun = seed.replace(/commit;\s*$/i, 'rollback;\n');
          if (dryRun === seed || !/rollback;\s*$/i.test(dryRun)) {
            throw new Error('Não foi possível gerar ensaio reversível.');
          }
          fs.writeFileSync('artifacts/cake-builder-catalog/dry-run.sql', dryRun);
          fs.writeFileSync(
            'artifacts/cake-builder-catalog/manifest.json',
            JSON.stringify({
              schema_version: 1,
              repository: 'AdoceBrigaderia/adoce-club',
              branch: process.env.EXPECTED_BRANCH,
              commit: process.env.GITHUB_SHA,
              project_ref: process.env.HOMOLOGATION_REF,
              production_forbidden: true,
              seed_sha256: crypto.createHash('sha256').update(seed).digest('hex'),
              live_audit_sha256: crypto.createHash('sha256').update(audit).digest('hex'),
            }, null, 2),
          );
          NODE
          ! grep -R "$PRODUCTION_REF" artifacts/cake-builder-catalog

      - name: Instalar cliente PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Confirmar pré-requisitos no banco de homologação
        env:
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
          PGCONNECT_TIMEOUT: "20"
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_HOMOLOGATION_DB_URL" \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="select case when to_regclass('public.cake_builder_templates') is not null and to_regclass('public.cake_builder_options') is not null and to_regclass('public.commercial_products') is not null then 'ready' else 'missing' end" \
            > artifacts/cake-builder-catalog/prerequisites.txt
          test "$(tr -d '[:space:]' < artifacts/cake-builder-catalog/prerequisites.txt)" = "ready"

      - name: Executar ensaio completo com rollback
        env:
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
          PGCONNECT_TIMEOUT: "20"
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_HOMOLOGATION_DB_URL" \
            --no-psqlrc --set=ON_ERROR_STOP=1 \
            --file=artifacts/cake-builder-catalog/dry-run.sql \
            > artifacts/cake-builder-catalog/dry-run.log

      - name: Aplicar seed real exclusivamente na homologação
        env:
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
          PGCONNECT_TIMEOUT: "20"
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_HOMOLOGATION_DB_URL" \
            --no-psqlrc --set=ON_ERROR_STOP=1 \
            --file="$SEED_FILE" \
            > artifacts/cake-builder-catalog/apply.log

      - name: Executar auditoria viva pós-seed
        env:
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
          PGCONNECT_TIMEOUT: "20"
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_HOMOLOGATION_DB_URL" \
            --no-psqlrc --set=ON_ERROR_STOP=1 \
            --file="$LIVE_AUDIT_FILE" \
            > artifacts/cake-builder-catalog/live-audit.log

      - name: Gerar evidência redigida
        env:
          BACKUP_EVIDENCE: ${{ inputs.backup_evidence }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$BACKUP_EVIDENCE" > artifacts/cake-builder-catalog/backup-evidence.txt
          printf '%s\n' "$EXPECTED_COMMIT" > artifacts/cake-builder-catalog/commit.txt
          printf '%s\n' "$HOMOLOGATION_REF" > artifacts/cake-builder-catalog/project-ref.txt
          ! grep -R "$PRODUCTION_REF" artifacts/cake-builder-catalog
          ! grep -R "postgresql://\|postgres://" artifacts/cake-builder-catalog

      - name: Preservar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-real-montador-homologacao-${{ github.run_number }}
          path: artifacts/cake-builder-catalog
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
