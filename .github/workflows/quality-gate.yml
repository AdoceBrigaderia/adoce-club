name: Portal quality gate

on:
  push:
    branches:
      - reestruturacao/ux-crm-operacao-imagens-v1
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

concurrency:
  group: portal-quality-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  CI: true
  EXPECTED_BRANCH: reestruturacao/ux-crm-operacao-imagens-v1
  DELIVERY_ISSUE_NUMBER: "13"

jobs:
  verify:
    name: Gate automático da branch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout do commit exato
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validar branch e SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar diagnósticos
        run: mkdir -p artifacts/ci

      - name: Instalar dependências com repetição transiente
        id: install
        shell: bash
        run: |
          set -o pipefail
          : > artifacts/ci/install.log
          for attempt in 1 2 3; do
            echo "Tentativa ${attempt}/3" | tee -a artifacts/ci/install.log
            if npm ci --prefer-offline --no-audit 2>&1 | tee -a artifacts/ci/install.log; then
              echo "Dependências instaladas na tentativa ${attempt}." | tee -a artifacts/ci/install.log
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "npm ci falhou após 3 tentativas." | tee -a artifacts/ci/install.log
          exit 1

      - name: TypeScript
        id: typescript
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee artifacts/ci/typescript.log

      - name: Testes unitários e contratuais
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee artifacts/ci/tests.log

      - name: Servidor do preview offline
        id: preview-server
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:homologation-preview-server 2>&1 | tee artifacts/ci/preview-server.log

      - name: Testes de auditoria, homologação e migrations
        id: audit-tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            npm run test:image-library-audit
            npm run test:browser-security-audit
            npm run test:homologation-environment
            npm run test:homologation-preflight
            npm run test:migration-integrity
            npm run test:migration-reconciliation
            npm run test:migration-repair
          } 2>&1 | tee artifacts/ci/audit-tests.log

      - name: Auditorias de runtime
        id: runtime-audits
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            npm run audit:image-library
            npm run audit:browser-security
          } 2>&1 | tee artifacts/ci/runtime-audits.log

      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee artifacts/ci/build.log

      - name: Gate de segurança do build
        id: security-build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run verify:security-build 2>&1 | tee artifacts/ci/security-build.log

      - name: Salvar logs de diagnóstico
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: adoce-ci-diagnostics-${{ github.sha }}
          path: artifacts/ci
          retention-days: 7
          if-no-files-found: warn

      - name: Salvar build de homologação aprovado
        if: ${{ steps.typescript.outcome == 'success' && steps.tests.outcome == 'success' && steps.preview-server.outcome == 'success' && steps.audit-tests.outcome == 'success' && steps.runtime-audits.outcome == 'success' && steps.build.outcome == 'success' && steps.security-build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: adoce-homologacao-${{ github.sha }}
          path: dist
          retention-days: 7
          if-no-files-found: error

      - name: Registrar resultado integral no issue de entrega
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          INSTALL: ${{ steps.install.outcome }}
          TYPESCRIPT: ${{ steps.typescript.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          PREVIEW_SERVER: ${{ steps.preview-server.outcome }}
          AUDIT_TESTS: ${{ steps.audit-tests.outcome }}
          RUNTIME_AUDITS: ${{ steps.runtime-audits.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SECURITY_BUILD: ${{ steps.security-build.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const stages = [
              ['Instalação', process.env.INSTALL],
              ['TypeScript', process.env.TYPESCRIPT],
              ['Testes unitários/contratuais', process.env.TESTS],
              ['Servidor offline', process.env.PREVIEW_SERVER],
              ['Testes de auditoria/migrations', process.env.AUDIT_TESTS],
              ['Auditorias de runtime', process.env.RUNTIME_AUDITS],
              ['Build', process.env.BUILD],
              ['Segurança do build', process.env.SECURITY_BUILD],
            ];
            const passed = stages.every(([, outcome]) => outcome === 'success');
            const body = [
              passed ? '## Gate integral aprovado' : '## Gate integral com falhas objetivas',
              '',
              `- Commit: \`${context.sha}\``,
              `- Execução: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              ...stages.map(([name, outcome]) => `- ${name}: **${outcome || 'não executado'}**`),
              '',
              passed
                ? '- Build de homologação preservado como artefato.'
                : '- Próxima ação: corrigir a primeira etapa marcada como failure; os demais logs foram preservados na mesma execução.',
              '- Produção: **não alterada**.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.DELIVERY_ISSUE_NUMBER),
              body,
            });

      - name: Falhar quando qualquer gate estiver inválido
        if: ${{ always() }}
        shell: bash
        env:
          INSTALL: ${{ steps.install.outcome }}
          TYPESCRIPT: ${{ steps.typescript.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          PREVIEW_SERVER: ${{ steps.preview-server.outcome }}
          AUDIT_TESTS: ${{ steps.audit-tests.outcome }}
          RUNTIME_AUDITS: ${{ steps.runtime-audits.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SECURITY_BUILD: ${{ steps.security-build.outcome }}
        run: |
          set -euo pipefail
          for outcome in \
            "$INSTALL" \
            "$TYPESCRIPT" \
            "$TESTS" \
            "$PREVIEW_SERVER" \
            "$AUDIT_TESTS" \
            "$RUNTIME_AUDITS" \
            "$BUILD" \
            "$SECURITY_BUILD"; do
            test "$outcome" = "success"
          done
