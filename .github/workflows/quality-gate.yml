name: Portal quality gate

on:
  push:
    branches:
      - reestruturacao/ux-crm-operacao-imagens-v1
  pull_request:
  workflow_dispatch:

concurrency:
  group: portal-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: TypeScript
        run: npm run lint

      - name: Unit and contract tests
        run: npm run test

      - name: Audit core tests
        run: |
          npm run test:image-library-audit
          npm run test:browser-security-audit
          npm run test:homologation-environment

      - name: Runtime audits
        run: |
          npm run audit:image-library
          npm run audit:browser-security

      - name: Build
        run: npm run build

      - name: Security build gate
        run: npm run verify:security-build

      - name: Save homologation build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adoce-homologacao-${{ github.sha }}
          path: dist
          retention-days: 7
