name: Portal quality gate

on:
  push:
    branches:
      - reestruturacao/ux-crm-operacao-imagens-v1
  pull_request:
  workflow_dispatch:

concurrency:
  group: portal-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: TypeScript, tests, audits and build
        run: npm run verify

      - name: Save homologation build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: adoce-homologacao-${{ github.sha }}
          path: dist
          retention-days: 7
