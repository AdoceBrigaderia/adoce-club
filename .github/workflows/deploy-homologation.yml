name: Publicar homologação isolada

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Digite PUBLICAR SOMENTE HOMOLOGACAO
        required: true
        type: string
      expected_commit:
        description: Commit exato da branch aprovado para o preview
        required: true
        type: string

concurrency:
  group: deploy-homologation
  cancel-in-progress: false

permissions:
  contents: read

env:
  EXPECTED_BRANCH: reestruturacao/ux-crm-operacao-imagens-v1
  NETLIFY_CONTEXT: branch-deploy
  SMOKE_URL: ${{ vars.HOMOLOGATION_SITE_URL }}
  PRODUCTION_SITE_ID: ${{ vars.NETLIFY_PRODUCTION_SITE_ID }}

jobs:
  deploy:
    name: Build, deploy isolado e smoke externo
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: homologation
    steps:
      - name: Baixar somente a branch de reestruturação
        uses: actions/checkout@v4
        with:
          ref: reestruturacao/ux-crm-operacao-imagens-v1
          fetch-depth: 1
          persist-credentials: false

      - name: Validar autorização, branch, commit e site separado
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          HOMOLOGATION_SITE_ID: ${{ secrets.NETLIFY_HOMOLOGATION_SITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_BRANCH="$(git branch --show-current)"
          CURRENT_COMMIT="$(git rev-parse HEAD)"
          test "$CONFIRMATION" = "PUBLICAR SOMENTE HOMOLOGACAO"
          test "$CURRENT_BRANCH" = "$EXPECTED_BRANCH"
          test "$CURRENT_COMMIT" = "$EXPECTED_COMMIT"
          test -n "$HOMOLOGATION_SITE_ID"
          test -n "$PRODUCTION_SITE_ID"
          test "$HOMOLOGATION_SITE_ID" != "$PRODUCTION_SITE_ID"
          case "$SMOKE_URL" in
            https://*.netlify.app) ;;
            *) echo "HOMOLOGATION_SITE_URL deve ser HTTPS e terminar em .netlify.app" >&2; exit 1 ;;
          esac
          case "$SMOKE_URL" in
            *adocebrigaderia.com.br*) echo "Domínio de produção proibido" >&2; exit 1 ;;
          esac

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --prefer-offline --no-audit

      - name: Executar gates completos antes do deploy
        run: npm run verify

      - name: Vincular exclusivamente ao site de homologação
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_HOMOLOGATION_SITE_ID: ${{ secrets.NETLIFY_HOMOLOGATION_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          npx --yes netlify-cli@26.2.0 link --id "$NETLIFY_HOMOLOGATION_SITE_ID"

      - name: Validar variáveis protegidas do cofre Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx --yes netlify-cli@26.2.0 env:exec --context "$NETLIFY_CONTEXT" -- npm run gate:homologation-environment

      - name: Gerar build com o ambiente de homologação
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx --yes netlify-cli@26.2.0 build --context "$NETLIFY_CONTEXT"

      - name: Publicar alias não produtivo
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_HOMOLOGATION_SITE_ID: ${{ secrets.NETLIFY_HOMOLOGATION_SITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx --yes netlify-cli@26.2.0 deploy \
            --site "$NETLIFY_HOMOLOGATION_SITE_ID" \
            --alias homologacao-adoce \
            --dir dist \
            --json > artifacts/netlify-homologation-deploy.json
          node - <<'NODE'
          const fs = require('fs');
          const deploy = JSON.parse(fs.readFileSync('artifacts/netlify-homologation-deploy.json', 'utf8'));
          if (!deploy.deploy_id && !deploy.id) throw new Error('Netlify não retornou o deploy_id.');
          if (deploy.is_prod === true) throw new Error('O deploy foi marcado incorretamente como produção.');
          console.log(`Deploy de homologação criado: ${deploy.deploy_id || deploy.id}`);
          NODE

      - name: Aguardar readiness sem revelar segredos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for attempt in $(seq 1 18); do
            status="$(curl -sS -o artifacts/homologation-readiness.json -w '%{http_code}' "$SMOKE_URL/api/homologation-readiness" || true)"
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 5
          done
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('artifacts/homologation-readiness.json', 'utf8'));
          if (payload.environment !== 'homologation') throw new Error('Ambiente publicado não é homologação.');
          if (payload.coreReady !== true) throw new Error(`Núcleo da homologação não está pronto: ${JSON.stringify(payload)}`);
          if (payload.site?.productionDomainRejected !== true) throw new Error('Domínio de produção não foi rejeitado.');
          if (payload.supabase?.isolated !== true) throw new Error('Supabase de homologação não está isolado.');
          console.log('Readiness aprovado sem exposição de valores secretos.');
          NODE

      - name: Instalar Chromium para smoke externo
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.61.1
          npx playwright install --with-deps chromium

      - name: Executar Playwright no preview publicado
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.HOMOLOGATION_SITE_URL }}
        run: npx playwright test

      - name: Preservar evidências da homologação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-publicada-${{ github.run_number }}
          path: |
            artifacts/netlify-homologation-deploy.json
            artifacts/homologation-readiness.json
            artifacts/playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
