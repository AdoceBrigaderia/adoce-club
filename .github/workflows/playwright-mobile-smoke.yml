name: Playwright mobile e tablet

on:
  push:
    branches:
      - reestruturacao/ux-crm-operacao-imagens-v1
  pull_request:
    branches:
      - fonte-oficial/portal-adoce-2026-07-25
  workflow_dispatch:

concurrency:
  group: playwright-mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Experiências reais em celular, tablet e computador
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências do portal
        run: npm ci --prefer-offline --no-audit

      - name: Gerar build inspecionável
        run: npm run build

      - name: Instalar Playwright isoladamente
        run: npm install --no-save --no-package-lock @playwright/test@1.61.1

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Executar smoke mobile, tablet e desktop
        run: npx playwright test

      - name: Preservar relatório e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-${{ github.run_number }}
          path: |
            artifacts/playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
