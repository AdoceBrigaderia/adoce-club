name: Gate do montador de tortas

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/cake-builder-pr-gate.yml
      - src/CakeCompositionBuilder.tsx
      - src/CakeOrderExperience.tsx
      - src/OperationCakeBuilderSettings.tsx
      - src/cake-builder.ts
      - src/cake-builder-public-input-security.test.ts
      - src/cake-builder-configuration-migration.test.ts
      - src/public-service-request-bff-security.test.ts
      - netlify/functions/_shared/cake-builder-input.ts
      - netlify/functions/public-service-request.ts
      - supabase/migrations/20260728073000_cake_builder_configuration.sql

concurrency:
  group: cake-builder-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  validate:
    name: Segurança, testes e build do montador
    if: ${{ github.head_ref == 'reestruturacao/ux-crm-operacao-imagens-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_ADOCE_VALIDATION_MODE: visual
      VITE_SUPABASE_URL: https://vazozolhbehnriytzcdc.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_9LTOAzzu8JU5vCogTk5N7w_ZZvzhGbM
      DIAGNOSTIC_ISSUE_NUMBER: "14"
    steps:
      - name: Baixar head exato do PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validar branch, commit e isolamento
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "reestruturacao/ux-crm-operacao-imagens-v1"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$VITE_SUPABASE_URL" = "https://vazozolhbehnriytzcdc.supabase.co"
          case "$VITE_SUPABASE_URL" in
            *uefwywizqhfvvijaopcn*) echo "Supabase produtivo rejeitado" >&2; exit 1 ;;
          esac

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        id: install
        run: npm ci --prefer-offline --no-audit

      - name: Validar TypeScript e preservar saída
        id: typescript
        if: ${{ success() }}
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npm run lint > >(tee artifacts/typescript.txt) 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Executar testes direcionados e preservar saída
        id: tests
        if: ${{ steps.install.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npx vitest run \
            src/cake-builder-public-input-security.test.ts \
            src/cake-builder-configuration-migration.test.ts \
            src/public-service-request-bff-security.test.ts \
            src/homologation-visual-preview.test.ts \
            > >(tee artifacts/tests.txt) 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Gerar build visual isolado e preservar saída
        id: build
        if: ${{ steps.install.outcome == 'success' }}
        shell: bash
        env:
          VITE_ADOCE_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p artifacts
          set +e
          npx vite build > >(tee artifacts/build.txt) 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Confirmar que produção não foi embutida
        id: isolation
        if: ${{ steps.build.outputs.exit_code == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "uefwywizqhfvvijaopcn" dist
          ! grep -R "adocebrigaderia.com.br" dist
          test -f dist/index.html

      - name: Registrar diagnóstico no issue técnico
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/github-script@v7
        env:
          TS_EXIT: ${{ steps.typescript.outputs.exit_code }}
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
          ISOLATION_OUTCOME: ${{ steps.isolation.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const read = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '';
            const tail = (text, limit = 3500) => text.length > limit ? text.slice(-limit) : text;
            const ts = process.env.TS_EXIT || 'não executado';
            const tests = process.env.TEST_EXIT || 'não executado';
            const build = process.env.BUILD_EXIT || 'não executado';
            const isolation = process.env.ISOLATION_OUTCOME || 'não executado';
            const ok = ts === '0' && tests === '0' && build === '0' && isolation === 'success';
            const details = [
              read('artifacts/typescript.txt'),
              read('artifacts/tests.txt'),
              read('artifacts/build.txt'),
            ].filter(Boolean).join('\n\n');
            const body = [
              ok ? '## Gate do montador aprovado' : '## Gate do montador com falha real',
              '',
              `- Commit: \`${context.payload.pull_request.head.sha}\``,
              `- TypeScript: \`${ts}\``,
              `- Testes direcionados: \`${tests}\``,
              `- Build visual: \`${build}\``,
              `- Isolamento de produção: \`${isolation}\``,
              `- Execução: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '```text',
              tail(details || 'Nenhuma saída técnica foi capturada.'),
              '```',
              '',
              '- Produção: **não alterada**.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.DIAGNOSTIC_ISSUE_NUMBER),
              body,
            });

      - name: Preservar diagnóstico
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cake-builder-gate-${{ github.event.pull_request.head.sha }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Reprovar quando algum gate falhar
        if: ${{ always() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          test "${{ steps.typescript.outputs.exit_code }}" = "0"
          test "${{ steps.tests.outputs.exit_code }}" = "0"
          test "${{ steps.build.outputs.exit_code }}" = "0"
          test "${{ steps.isolation.outcome }}" = "success"
