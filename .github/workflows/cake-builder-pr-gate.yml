name: Gate do montador de tortas

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/cake-builder-pr-gate.yml
      - src/CakeCompositionBuilder.tsx
      - src/CakeOrderExperience.tsx
      - src/OperationCakeBuilderSettings.tsx
      - src/cake-builder.ts
      - src/cake-builder-public-input-security.test.ts
      - src/cake-builder-configuration-migration.test.ts
      - src/public-service-request-bff-security.test.ts
      - netlify/functions/_shared/cake-builder-input.ts
      - netlify/functions/public-service-request.ts
      - supabase/migrations/20260728073000_cake_builder_configuration.sql

concurrency:
  group: cake-builder-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  validate:
    name: Segurança, testes e build do montador
    if: ${{ github.head_ref == 'reestruturacao/ux-crm-operacao-imagens-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_ADOCE_VALIDATION_MODE: visual
      VITE_SUPABASE_URL: https://vazozolhbehnriytzcdc.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_9LTOAzzu8JU5vCogTk5N7w_ZZvzhGbM
      DIAGNOSTIC_ISSUE_NUMBER: "14"
      DELIVERY_ISSUE_NUMBER: "13"
    steps:
      - name: Baixar head exato do PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validar branch, commit e isolamento
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "reestruturacao/ux-crm-operacao-imagens-v1"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$VITE_SUPABASE_URL" = "https://vazozolhbehnriytzcdc.supabase.co"
          case "$VITE_SUPABASE_URL" in
            *uefwywizqhfvvijaopcn*) echo "Supabase produtivo rejeitado" >&2; exit 1 ;;
          esac

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        id: install
        run: npm ci --prefer-offline --no-audit

      - name: Validar TypeScript e preservar saída
        id: typescript
        if: ${{ success() }}
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npm run lint > >(tee artifacts/typescript.txt) 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Executar testes direcionados e preservar saída
        id: tests
        if: ${{ steps.install.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npx vitest run \
            src/cake-builder-public-input-security.test.ts \
            src/cake-builder-configuration-migration.test.ts \
            src/public-service-request-bff-security.test.ts \
            src/homologation-visual-preview.test.ts \
            > >(tee artifacts/tests.txt) 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Gerar build visual isolado e preservar saída
        id: build
        if: ${{ steps.install.outcome == 'success' }}
        shell: bash
        env:
          VITE_ADOCE_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p artifacts
          set +e
          npx vite build > >(tee artifacts/build.txt) 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Confirmar que produção não foi embutida
        id: isolation
        if: ${{ steps.build.outputs.exit_code == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "uefwywizqhfvvijaopcn" dist
          ! grep -R "adocebrigaderia.com.br" dist
          test -f dist/index.html

      - name: Preparar pacote testável validado
        id: package
        if: ${{ steps.typescript.outputs.exit_code == '0' && steps.tests.outputs.exit_code == '0' && steps.build.outputs.exit_code == '0' && steps.isolation.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          package_dir="artifacts/portal-adoce-preview-validado"
          mkdir -p "$package_dir"
          cp -R dist "$package_dir/dist"
          cp scripts/serve-homologation-preview.mjs "$package_dir/servidor-preview.mjs"

          cat > "$package_dir/INICIAR-PREVIEW-WINDOWS.cmd" <<'EOF_WINDOWS'
          @echo off
          cd /d "%~dp0"
          where node >nul 2>nul
          if errorlevel 1 (
            echo Node.js 22 ou superior nao foi encontrado.
            pause
            exit /b 1
          )
          node servidor-preview.mjs --open
          if errorlevel 1 pause
          EOF_WINDOWS

          cat > "$package_dir/INICIAR-PREVIEW-LINUX-MAC.command" <<'EOF_UNIX'
          #!/usr/bin/env sh
          set -eu
          cd "$(dirname "$0")"
          exec node servidor-preview.mjs --open
          EOF_UNIX
          chmod +x "$package_dir/INICIAR-PREVIEW-LINUX-MAC.command"

          cat > "$package_dir/LEIA-ME.txt" <<EOF_README
          PORTAL ADOCE — PREVIEW VALIDADO DO MONTADOR DE TORTAS

          Windows: extraia o ZIP e abra INICIAR-PREVIEW-WINDOWS.cmd.
          macOS/Linux: execute INICIAR-PREVIEW-LINUX-MAC.command.
          URL local: http://127.0.0.1:4173

          Commit: ${{ github.event.pull_request.head.sha }}
          Inclui: Clube e Operação em modo visual, encomendas e montador completo de tortas.
          Gates: TypeScript, 25 testes direcionados, build visual e isolamento de produção.
          Produção: não alterada.
          EOF_README

          printf '%s\n' \
            "Commit: ${{ github.event.pull_request.head.sha }}" \
            "TypeScript: aprovado" \
            "Testes direcionados: aprovados" \
            "Build visual: aprovado" \
            "Isolamento produtivo: aprovado" \
            "Produção: não alterada" \
            > "$package_dir/EVIDENCIA.txt"

          node "$package_dir/servidor-preview.mjs" --port 4187 > "$package_dir/SMOKE.log" 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          status="000"
          for attempt in $(seq 1 20); do
            status="$(curl -sS -o /tmp/adoce-index.html -w '%{http_code}' http://127.0.0.1:4187/ || true)"
            [ "$status" = "200" ] && break
            sleep 1
          done
          test "$status" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:4187/operacao/venda-rapida)" = "200"
          cleanup
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Publicar pacote validado
        id: preview-upload
        if: ${{ steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: portal-adoce-preview-validado-${{ github.event.pull_request.head.sha }}
          path: artifacts/portal-adoce-preview-validado
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Registrar entrega validada
        if: ${{ steps.preview-upload.outcome == 'success' }}
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.preview-upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.preview-upload.outputs.artifact-digest }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = [
              '## Preview atualizado e validado disponível',
              '',
              `- Commit: \`${context.payload.pull_request.head.sha}\``,
              `- [Baixar pacote testável](${process.env.ARTIFACT_URL})`,
              `- Digest: \`${process.env.ARTIFACT_DIGEST}\``,
              '- Inclui Clube e Operação acessíveis no modo visual e montador completo de tortas.',
              '- Gates: TypeScript, 25 testes direcionados, build visual, isolamento produtivo e smoke tests HTTP 200.',
              '- Produção: **não alterada**.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.DELIVERY_ISSUE_NUMBER),
              body,
            });

      - name: Registrar diagnóstico no issue técnico
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/github-script@v7
        env:
          TS_EXIT: ${{ steps.typescript.outputs.exit_code }}
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
          ISOLATION_OUTCOME: ${{ steps.isolation.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const read = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '';
            const tail = (text, limit = 3500) => text.length > limit ? text.slice(-limit) : text;
            const ts = process.env.TS_EXIT || 'não executado';
            const tests = process.env.TEST_EXIT || 'não executado';
            const build = process.env.BUILD_EXIT || 'não executado';
            const isolation = process.env.ISOLATION_OUTCOME || 'não executado';
            const ok = ts === '0' && tests === '0' && build === '0' && isolation === 'success';
            const details = [
              read('artifacts/typescript.txt'),
              read('artifacts/tests.txt'),
              read('artifacts/build.txt'),
            ].filter(Boolean).join('\n\n');
            const body = [
              ok ? '## Gate do montador aprovado' : '## Gate do montador com falha real',
              '',
              `- Commit: \`${context.payload.pull_request.head.sha}\``,
              `- TypeScript: \`${ts}\``,
              `- Testes direcionados: \`${tests}\``,
              `- Build visual: \`${build}\``,
              `- Isolamento de produção: \`${isolation}\``,
              `- Execução: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '```text',
              tail(details || 'Nenhuma saída técnica foi capturada.'),
              '```',
              '',
              '- Produção: **não alterada**.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.DIAGNOSTIC_ISSUE_NUMBER),
              body,
            });

      - name: Preservar diagnóstico
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cake-builder-gate-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/typescript.txt
            artifacts/tests.txt
            artifacts/build.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Reprovar quando algum gate falhar
        if: ${{ always() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          test "${{ steps.typescript.outputs.exit_code }}" = "0"
          test "${{ steps.tests.outputs.exit_code }}" = "0"
          test "${{ steps.build.outputs.exit_code }}" = "0"
          test "${{ steps.isolation.outcome }}" = "success"
