name: Pré-flight das migrations de homologação

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/homologation-pending-migrations-preflight.yml
      - .github/workflows/homologation-apply-pending-migrations.yml
      - docs/evidence/homologation-backup-confirmed-20260728.json
      - docs/evidence/homologation-pending-migrations-20260728.json
      - docs/evidence/homologation-migrations-20260727.json
      - docs/evidence/homologation-migration-repair-plan-20260727.json
      - scripts/homologation-pending-migrations.mjs
      - scripts/homologation-pending-migrations.test.mjs
      - scripts/homologation-migration-apply-workflow.test.mjs
      - scripts/reconcile-homologation-migration-filenames.mjs
      - scripts/reconcile-homologation-migration-filenames.test.mjs
      - package.json
      - supabase/migrations/**
      - supabase/tests/homologation_post_migration_live.sql

concurrency:
  group: homologation-migrations-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMOLOGATION_REF: vazozolhbehnriytzcdc
  PRODUCTION_REF: uefwywizqhfvvijaopcn
  EXPECTED_BRANCH: reestruturacao/ux-crm-operacao-imagens-v1

jobs:
  validate:
    name: Inventário, ordem, aplicação e bloqueios
    if: ${{ github.head_ref == 'reestruturacao/ux-crm-operacao-imagens-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar head exato
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validar commit e ambiente
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.head.ref }}" = "$EXPECTED_BRANCH"
          test "$HOMOLOGATION_REF" = "vazozolhbehnriytzcdc"
          test "$PRODUCTION_REF" = "uefwywizqhfvvijaopcn"
          test "$HOMOLOGATION_REF" != "$PRODUCTION_REF"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar, testar e gerar relatório
        run: |
          npm ci --prefer-offline --no-audit
          npm run test:homologation-pending-migrations
          npm run test:homologation-migration-apply
          npm run report:homologation-pending-migrations

      - name: Confirmar inventário completo
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('artifacts/homologation-pending-migrations.json', 'utf8'));
          if (report.structural_passed !== true) throw new Error('Plano estrutural reprovado.');
          if (report.pending_count !== 18) throw new Error(`Esperadas 18 migrations; encontradas ${report.pending_count}.`);
          if (report.apply_blockers.length !== 1 || report.apply_blockers[0] !== 'dry_run_pendente') {
            throw new Error(`Bloqueios inesperados: ${report.apply_blockers.join(', ')}`);
          }
          NODE

      - name: Preservar pré-flight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-migrations-homologacao-${{ github.run_number }}
          path: |
            artifacts/homologation-pending-migrations.json
            artifacts/homologation-pending-migrations.md
          if-no-files-found: error
          retention-days: 30
