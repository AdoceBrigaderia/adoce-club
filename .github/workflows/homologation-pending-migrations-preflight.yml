name: Pré-flight e aplicação das migrations de homologação

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/homologation-pending-migrations-preflight.yml
      - docs/evidence/homologation-backup-confirmed-20260728.json
      - docs/evidence/homologation-pending-migrations-20260728.json
      - docs/evidence/homologation-migrations-20260727.json
      - docs/evidence/homologation-migration-repair-plan-20260727.json
      - scripts/homologation-pending-migrations.mjs
      - scripts/homologation-pending-migrations.test.mjs
      - scripts/reconcile-homologation-migration-filenames.mjs
      - scripts/reconcile-homologation-migration-filenames.test.mjs
      - package.json
      - supabase/migrations/**

concurrency:
  group: homologation-migrations-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HOMOLOGATION_REF: vazozolhbehnriytzcdc
  PRODUCTION_REF: uefwywizqhfvvijaopcn
  EXPECTED_BRANCH: reestruturacao/ux-crm-operacao-imagens-v1

jobs:
  validate:
    name: Inventário, ordem e bloqueios
    if: ${{ github.head_ref == 'reestruturacao/ux-crm-operacao-imagens-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar head exato
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validar commit e ambiente
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.head.ref }}" = "$EXPECTED_BRANCH"
          test "$HOMOLOGATION_REF" = "vazozolhbehnriytzcdc"
          test "$PRODUCTION_REF" = "uefwywizqhfvvijaopcn"
          test "$HOMOLOGATION_REF" != "$PRODUCTION_REF"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar, testar e gerar relatório
        run: |
          npm ci --prefer-offline --no-audit
          npm run test:homologation-pending-migrations
          npm run report:homologation-pending-migrations

      - name: Confirmar inventário completo
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('artifacts/homologation-pending-migrations.json', 'utf8'));
          if (report.structural_passed !== true) throw new Error('Plano estrutural reprovado.');
          if (report.pending_count !== 17) throw new Error(`Esperadas 17 migrations; encontradas ${report.pending_count}.`);
          if (report.apply_blockers.length !== 1 || report.apply_blockers[0] !== 'dry_run_pendente') {
            throw new Error(`Bloqueios inesperados: ${report.apply_blockers.join(', ')}`);
          }
          NODE

      - name: Preservar pré-flight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-migrations-homologacao-${{ github.run_number }}
          path: |
            artifacts/homologation-pending-migrations.json
            artifacts/homologation-pending-migrations.md
          if-no-files-found: error
          retention-days: 30

  apply-homologation:
    name: Diagnóstico, dry-run e db push na homologação
    needs: validate
    if: ${{ github.head_ref == 'reestruturacao/ux-crm-operacao-imagens-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: homologation
    steps:
      - name: Baixar SHA exato do PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validar autorização e backup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git log -1 --pretty=%s)" = "ci: diagnosticar credenciais e aplicar homologacao"
          node - <<'NODE'
          const fs = require('fs');
          const evidence = JSON.parse(fs.readFileSync('docs/evidence/homologation-backup-confirmed-20260728.json', 'utf8'));
          if (evidence.project_id !== 'vazozolhbehnriytzcdc') throw new Error('Backup de projeto incorreto.');
          if (evidence.accepted_for_homologation_migration_gate !== true) throw new Error('Backup não aceito.');
          if (evidence.package?.sha256 !== 'e45f322ecece827609f2932762e390353f7b4a72ed709269e6d500f2f60ad354') throw new Error('Digest divergente.');
          if (evidence.package?.invalid_checksum_count !== 0) throw new Error('Checksum inválido.');
          if (evidence.storage?.verified_object_count !== 430) throw new Error('Storage incompleto.');
          NODE

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirmar segredo SUPABASE_ACCESS_TOKEN
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN não está configurado no environment homologation" >&2
            exit 21
          fi

      - name: Confirmar segredo SUPABASE_DB_PASSWORD
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "SUPABASE_DB_PASSWORD não está configurado no environment homologation" >&2
            exit 22
          fi

      - name: Validar token do Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.109.1 projects list >/tmp/supabase-projects.txt
          grep -q "$HOMOLOGATION_REF" /tmp/supabase-projects.txt
          ! grep -q "$PRODUCTION_REF.*LINKED" /tmp/supabase-projects.txt

      - name: Vincular exclusivamente à homologação
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.109.1 link --project-ref "$HOMOLOGATION_REF" --password "$SUPABASE_DB_PASSWORD"
          test "$(cat supabase/.temp/project-ref)" = "$HOMOLOGATION_REF"
          test "$(cat supabase/.temp/project-ref)" != "$PRODUCTION_REF"

      - name: Reconciliar nomes locais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/homologation-migrations
          node --test scripts/reconcile-homologation-migration-filenames.test.mjs
          node scripts/reconcile-homologation-migration-filenames.mjs --strict --apply \
            > artifacts/homologation-migrations/filename-reconciliation.json
          git diff --check

      - name: Confirmar repairs remotos
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.109.1 migration list --linked --password "$SUPABASE_DB_PASSWORD" \
            > artifacts/homologation-migrations/migration-list-before.txt
          grep -q "20260727035116" artifacts/homologation-migrations/migration-list-before.txt
          grep -q "20260727035246" artifacts/homologation-migrations/migration-list-before.txt
          grep -q "20260727035513" artifacts/homologation-migrations/migration-list-before.txt
          ! grep -q "20260727035059" artifacts/homologation-migrations/migration-list-before.txt
          ! grep -q "20260727035343" artifacts/homologation-migrations/migration-list-before.txt
          ! grep -q "20260727040533" artifacts/homologation-migrations/migration-list-before.txt

      - name: Executar dry-run integral
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.109.1 db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run \
            > artifacts/homologation-migrations/db-push-dry-run.txt 2>&1
          cat artifacts/homologation-migrations/db-push-dry-run.txt
          for migration in 20260728073000 20260728090000 20260728093000 20260728103000 20260728115000 20260728115100 20260728130000 20260728154500 20260728164000 20260728165116 20260728165303 20260728170236 20260728170246 20260728170307 20260728170501 20260728170941 20260728174500; do
            grep -q "$migration" artifacts/homologation-migrations/db-push-dry-run.txt
          done

      - name: Aplicar as 17 migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.109.1 db push --linked --password "$SUPABASE_DB_PASSWORD" \
            > artifacts/homologation-migrations/db-push-apply.txt 2>&1
          cat artifacts/homologation-migrations/db-push-apply.txt
          npx --yes supabase@2.109.1 migration list --linked --password "$SUPABASE_DB_PASSWORD" \
            > artifacts/homologation-migrations/migration-list-after.txt

      - name: Preservar evidências da aplicação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrations-homologacao-${{ github.run_number }}
          path: artifacts/homologation-migrations
          if-no-files-found: warn
          retention-days: 30
