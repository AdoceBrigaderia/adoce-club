name: Auditar fronteira RPC das encomendas na homologação

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Digite AUDITAR ENCOMENDAS RPC SOMENTE HOMOLOGACAO seguido do project ref
        required: true
        type: string
      expected_commit:
        description: SHA completo autorizado da branch de reestruturação
        required: true
        type: string

concurrency:
  group: service-request-rpc-boundary-live-homologation
  cancel-in-progress: false

permissions:
  contents: read

env:
  EXPECTED_BRANCH: reestruturacao/ux-crm-operacao-imagens-v1
  HOMOLOGATION_REF: ${{ vars.ADOCE_HOMOLOGATION_SUPABASE_REF }}
  PRODUCTION_REF: ${{ vars.ADOCE_PRODUCTION_SUPABASE_REF }}
  LIVE_TEST_FILE: supabase/tests/service_request_rpc_boundary_live.sql

jobs:
  service-request-boundary:
    name: Validar encomendas RPC-only sem alterar dados
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: homologation
    steps:
      - name: Baixar exclusivamente a branch autorizada
        uses: actions/checkout@v4
        with:
          ref: reestruturacao/ux-crm-operacao-imagens-v1
          fetch-depth: 1
          persist-credentials: false

      - name: Validar autorização, commit e banco isolado
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -n "$HOMOLOGATION_REF"
          test -n "$PRODUCTION_REF"
          test "$HOMOLOGATION_REF" != "$PRODUCTION_REF"
          test "$CONFIRMATION" = "AUDITAR ENCOMENDAS RPC SOMENTE HOMOLOGACAO $HOMOLOGATION_REF"
          test -s "$LIVE_TEST_FILE"
          test -n "$SUPABASE_HOMOLOGATION_DB_URL"
          case "$SUPABASE_HOMOLOGATION_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "URL PostgreSQL de homologação inválida" >&2; exit 1 ;;
          esac
          case "$SUPABASE_HOMOLOGATION_DB_URL" in
            *"$HOMOLOGATION_REF"*) ;;
            *) echo "A URL não pertence ao Supabase de homologação" >&2; exit 1 ;;
          esac
          case "$SUPABASE_HOMOLOGATION_DB_URL" in
            *"$PRODUCTION_REF"*) echo "Referência de produção detectada e bloqueada" >&2; exit 1 ;;
          esac
          grep -q '^begin;' "$LIVE_TEST_FILE"
          grep -q '^rollback;' "$LIVE_TEST_FILE"
          ! grep -q "$PRODUCTION_REF" "$LIVE_TEST_FILE"

      - name: Preparar Node para auditoria determinística
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Validar manifesto, migrations, SQL e workflow
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-service-request-table-surface.mjs

      - name: Instalar cliente PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Executar auditoria viva com rollback
        env:
          SUPABASE_HOMOLOGATION_DB_URL: ${{ secrets.SUPABASE_HOMOLOGATION_DB_URL }}
          PGCONNECT_TIMEOUT: "15"
        shell: bash
        run: |
          set -euo pipefail
          output_dir="artifacts/service-request-rpc-boundary"
          mkdir -p "$output_dir"
          psql "$SUPABASE_HOMOLOGATION_DB_URL" \
            --no-psqlrc --set=ON_ERROR_STOP=1 \
            --file="$LIVE_TEST_FILE" \
            2>&1 | tee "$output_dir/service-request-rpc-boundary.log"
          grep -Eiq "ROLLBACK" "$output_dir/service-request-rpc-boundary.log"
          printf '%s\n' "$(git rev-parse HEAD)" > "$output_dir/commit.txt"
          printf '%s\n' "$HOMOLOGATION_REF" > "$output_dir/project-ref.txt"
          sha256sum "$LIVE_TEST_FILE" > "$output_dir/test-sql.sha256"
          sha256sum security/service-request-table-surface.json > "$output_dir/manifest.sha256"
          sha256sum supabase/migrations/20260729202000_lock_service_request_tables_to_rpc.sql \
            > "$output_dir/lock-migration.sha256"
          sha256sum supabase/migrations/20260729203000_harden_service_request_store_scope.sql \
            > "$output_dir/hardening-migration.sha256"
          ! grep -R "$PRODUCTION_REF" "$output_dir"
          ! grep -R "postgresql://\|postgres://" "$output_dir"

      - name: Preservar evidências redigidas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-request-rpc-boundary-${{ github.sha }}
          path: artifacts/service-request-rpc-boundary
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6
